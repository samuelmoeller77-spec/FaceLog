
name: Build FaceLog APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FaceLog-Android-Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract project
        run: unzip FaceLog-Android-Project.zip -d source

      - name: Install dependencies
        working-directory: source/FaceLog
        run: npm ci

      - name: Build web app
        working-directory: source/FaceLog
        run: npm run build

      - name: Create Android project
        working-directory: source/FaceLog
        run: npx cap add android

      - name: Build APK
        working-directory: source/FaceLog/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FaceLog-APK
          path: source/FaceLog/android/app/build/outputs/apk/debug/app-debug.apk
