
name: Build FaceLog APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FaceLog-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Wichtig: v4 statt v3, damit das veraltete
      # Android-SDK-Paket "tools" nicht angefordert wird.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Unpack FaceLog project
        shell: bash
        run: |
          set -euo pipefail

          test -f "FaceLog-Android-Project.zip" || {
            echo "ERROR: FaceLog-Android-Project.zip fehlt im Repository."
            exit 1
          }

          mkdir -p source
          unzip -oq "FaceLog-Android-Project.zip" -d source

          test -f "source/FaceLog/package.json" || {
            echo "ERROR: package.json wurde im ZIP nicht gefunden."
            find source -maxdepth 4 -name package.json -print
            exit 1
          }

      - name: Install JavaScript dependencies
        working-directory: source/FaceLog
        run: npm ci

      - name: Build web app
        working-directory: source/FaceLog
        run: npm run build

      - name: Create Android project and sync assets
        working-directory: source/FaceLog
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build debug APK
        working-directory: source/FaceLog/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceLog-APK
          path: source/FaceLog/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
